services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPACESCAN_DB_PATH: /app/storage/spacescan.db
      SPACESCAN_CORS_ORIGINS: ${SPACESCAN_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - spacescan_storage:/app/storage

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_DOMAIN: ${API_DOMAIN:-http://}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  spacescan_storage:
  caddy_data:
  caddy_config:
