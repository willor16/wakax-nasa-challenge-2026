[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spacescan-backend"
version = "1.0.0"
description = "Onboard autonomous crew health monitoring API for deep-space missions."
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10.4,<4.0.0",
  "argon2-cffi>=23.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "pydantic>=2.9.0",
  "pyjwt>=2.9.0",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
  "numpy>=1.26",
  "onnxruntime>=1.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]
# Only to retrain the onboard anomaly model (backend/ml); not needed to run the app.
train = [
  "scikit-learn>=1.5",
  "skl2onnx>=1.17",
  "onnx>=1.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "db*"]
